<title>РАССВЕТ</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1420;font:14px "Trebuchet MS",system-ui,sans-serif;color:#3b2a20}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
.hide{display:none!important}
.px{background:#fff3d6;border:3px solid #3b2a20;border-radius:6px;box-shadow:0 3px 0 #0006,inset 0 0 0 2px #e6c88f}

.btn:hover:not(:disabled){transform:translateX(8px);background:#ffd98a}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #0007}
.btn:disabled{opacity:.45}
#menu{position:fixed;left:calc(5vw + env(safe-area-inset-left));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;width:min(270px,42vw)}
#menu h1{margin:0 0 8px;font:900 clamp(32px,10vh,58px) Georgia,serif;letter-spacing:2px;color:#fff1b8;text-shadow:0 3px 0 #a44a3a,0 6px 0 #5a2a40,0 0 22px #ffb870}

#hud>div{display:flex;gap:6px;pointer-events:auto}
.chip{padding:4px 9px;font-weight:bold;font-size:13px;color:#3b2a20}
button.chip{cursor:pointer;touch-action:manipulation}
#toast{position:fixed;top:46px;left:50%;transform:translateX(-50%);padding:6px 12px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;white-space:nowrap}
#toast.on{opacity:1}
#hint{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:5px 12px;font-weight:bold;font-size:13px;z-index:5;pointer-events:none}
#dlg{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(460px,60vw);padding:8px 12px;z-index:15}
#dlg p{margin:4px 0 8px}#do{display:flex;flex-wrap:wrap;gap:6px}
.s{padding:5px 10px;font-size:13px}

.panel *{touch-action:manipulation}.panel input{touch-action:pan-x}
.panel h2{margin:0;font-family:Georgia,serif}.panel label{display:flex;justify-content:space-between;align-items:center;gap:10px}
#ing{display:flex;gap:8px}
#slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.slot{display:flex;align-items:center;gap:6px;background:#fffaf0;border:2px solid #3b2a20;border-radius:5px;padding:5px;font:bold 12px "Trebuchet MS",sans-serif;color:#3b2a20;cursor:pointer}
.slot img{width:28px;height:28px;image-rendering:pixelated}
#touch{position:fixed;inset:0;pointer-events:none;z-index:4}
#touch>*{pointer-events:auto}
#joy{position:absolute;left:calc(3vw + env(safe-area-inset-left));bottom:12px;width:150px;height:150px;display:flex;align-items:center;justify-content:center}
#joy i{position:absolute;width:112px;height:112px;border-radius:50%;background:#ffffff26;border:3px solid #ffffff66}
#knob{width:54px;height:54px;border-radius:50%;background:#fff3d6cc;border:3px solid #3b2a20;position:relative}
.tb{position:absolute;border-radius:50%;border:3px solid #3b2a20;background:#fff3d6cc;font:bold 11px "Trebuchet MS",sans-serif;display:flex;align-items:center;justify-content:center;color:#3b2a20}
.tb.on{background:#ffb870;transform:scale(.93)}
#bAct{right:calc(4vw + env(safe-area-inset-right));bottom:18px;width:68px;height:68px}
#bJump{right:calc(4vw + 80px);bottom:30px;width:58px;height:58px}
#bRun{right:calc(4vw + 14px);bottom:96px;width:58px;height:58px}
#bye{position:fixed;inset:0;background:#1b1420ee;z-index:40;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:#ffe29a;font:22px Georgia,serif}
#rot{position:fixed;inset:0;z-index:99;background:#1b1420;color:#ffe29a;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font:20px Georgia,serif}
@media (orientation:portrait) and (max-width:820px){#rot{display:flex}}

 {const h=t/60,dt_=h>=6&&h<20,u=dt_?(h-6)/14:(h>=20?(h-20):h+4)/10,sx=VW/2-30+u*60,sy=22-Math.sin(u*3.14)*14;X.fillStyle='rgba(30,20,50,.5)';X.fillRect(VW/2-34,26,68,2);X.fillStyle=dt_?'#ffd24a':'#e8ecff';X.beginPath();X.arc(sx,sy+4,4,0,7);X.fill();if(!dt_){X.fillStyle='#2a2f55';X.beginPath();X.arc(sx+2,sy+3,3,0,7);X.fill()}}
